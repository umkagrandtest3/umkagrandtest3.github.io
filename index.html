<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>АТБ ВІД ЖЕНІ — Магазин</title>
  <style>
    :root{
      --accent:#2d9cdb;
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --success:#10b981;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#ffffff 60%);}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(15,23,42,0.06);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#4ade80,#06b6d4);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px}
    h1{margin:0;font-size:20px}
    .controls{display:flex;align-items:center;gap:12px}
    .search{padding:8px 12px;border-radius:10px;border:1px solid #e6e9ef;background:white}
    main{display:grid;grid-template-columns:1fr 360px;gap:20px;padding:28px;max-width:1200px;margin:18px auto}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(13,23,42,0.06);display:flex;flex-direction:column;gap:10px}
    .img{height:110px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(180deg,#fff,#f2f7f5);}
    .meta{display:flex;justify-content:space-between;align-items:center}
    .name{font-weight:700}
    .price{font-weight:800}
    .actions{display:flex;gap:8px}
    button{cursor:pointer;border:0;padding:8px 10px;border-radius:8px}
    .btn-add{background:var(--accent);color:white}
    .btn-ghost{background:transparent;border:1px solid #e6e9ef}
    /* cart */
    .cart{background:linear-gradient(180deg, #fff, #fbfdff);border-radius:12px;padding:14px;height:fit-content;position:sticky;top:86px;box-shadow:0 6px 18px rgba(13,23,42,0.06)}
    .cart h2{margin:0 0 12px 0}
    .cart-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:6px}
    .cart-item{display:flex;align-items:center;gap:10px;background:rgba(15,23,42,0.02);padding:8px;border-radius:8px}
    .ci-img{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;background:white}
    .ci-title{flex:1}
    .qty{display:flex;align-items:center;gap:6px}
    .total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed #eef2f7}
    .empty{color:var(--muted);text-align:center;padding:24px}
    footer{padding:18px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:920px){main{grid-template-columns:1fr;}.cart{position:relative;top:0}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">АТБ</div>
      <div>
        <h1>АТБ ВІД ЖЕНІ</h1>
        <div style="font-size:12px;color:var(--muted)">Свіжі помідори, огірки та інші смаколики</div>
      </div>
    </div>
    <div class="controls">
      <input id="searchInput" class="search" placeholder="Шукати: помідор, огірок..." />
      <button id="clearBtn" class="btn-ghost">Очистити кошик</button>
    </div>
  </header>

  <main>
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="margin:0">Продукти</h2>
        <div style="color:var(--muted)">Всього <span id="productsCount">0</span> позицій</div>
      </div>

      <div class="products" id="productsGrid"></div>
    </section>

    <aside>
      <div class="cart">
        <h2>Кошик <span id="cartCount" style="color:var(--muted);font-weight:400">(0)</span></h2>
        <div class="cart-list" id="cartList"></div>
        <div class="empty" id="cartEmpty">Кошик порожній — додайте товари</div>
        <div class="total" id="cartTotalWrap" style="display:none">
          <div>Разом:</div>
          <div style="font-weight:800;font-size:18px" id="cartTotal">0 ₴</div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="checkoutBtn" class="btn-add" style="flex:1">Оформити</button>
          <button id="continueBtn" class="btn-ghost">Продовжити</button>
        </div>
      </div>
    </aside>
  </main>

  <footer>Це демонстраційна сторінка — &copy; АТБ ВІД ЖЕНІ</footer>

  <script>
    // Придумані товари
    const PRODUCTS = [
      {id: 'tom-red-1', name: 'Помідор червоний (1кг)', emoji: '🍅', price: 49},
      {id: 'tom-cherry', name: 'Черрі помідори (300г)', emoji: '🍒', price: 79},
      {id: 'cuc-fresh', name: 'Огірок свіжий (1кг)', emoji: '🥒', price: 39},
      {id: 'cuc-mini', name: 'Міні-огірочки (500г)', emoji: '🥒', price: 45},
      {id: 'salad-mix', name: 'Готовий салат з помідорів і огірків (400г)', emoji: '🥗', price: 89},
      {id: 'pickles', name: 'Мариновані огірки (720мл)', emoji: '🥒', price: 69},
      {id: 'ketchup', name: 'Кетчуп домашній (350г)', emoji: '🫙', price: 55},
      {id: 'juice-tom', name: 'Томатний сік (1л)', emoji: '🧃', price: 65},
      {id: 'salsa', name: 'Сальса гостра (250г)', emoji: '🌶️', price: 79},
      {id: 'seedlings', name: 'Саджанці помідорів (1 шт)', emoji: '🌱', price: 29},
      {id: 'organic-tom', name: 'Органічні помідори (1кг)', emoji: '🍅', price: 119},
      {id: 'cucumber-eco', name: 'Еко-огірки (1кг)', emoji: '🥒', price: 89},
      {id: 'tom-paste', name: 'Томатна паста (200г)', emoji: '🫙', price: 35},
      {id: 'gazpacho', name: 'Газпачо (суп, 500мл)', emoji: '🥣', price: 99},
      {id: 'vinegar', name: 'Оцет для маринаду (500мл)', emoji: '🧴', price: 39}
    ];

    // Cart state
    let cart = {};

    // Helpers
    const q = s => document.querySelector(s);
    const qi = s => document.getElementById(s);

    function formatPrice(n){
      return n.toLocaleString('uk-UA') + ' ₴';
    }

    // Render products
    function renderProducts(filter=''){
      const grid = qi('productsGrid');
      grid.innerHTML = '';
      const filtered = PRODUCTS.filter(p => (p.name + ' ' + p.emoji).toLowerCase().includes(filter.toLowerCase()));
      qi('productsCount').textContent = filtered.length;
      filtered.forEach(p => {
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = `
          <div class="img">${p.emoji}</div>
          <div class="meta"><div class="name">${p.name}</div><div class="price">${formatPrice(p.price)}</div></div>
          <div style="color:var(--muted);font-size:13px">Опис: смачний, свіжий товар від локальних постачальників.</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
            <div style="display:flex;gap:8px;align-items:center">
              <button class="btn-ghost" onclick="addToCart('${p.id}',1)">+1</button>
              <button class="btn-ghost" onclick="addToCart('${p.id}',3)">+3</button>
            </div>
            <button class="btn-add" onclick="addToCart('${p.id}',1)">Додати</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Cart functions
    function saveCart(){
      localStorage.setItem('atb_cart', JSON.stringify(cart));
    }
    function loadCart(){
      try{cart = JSON.parse(localStorage.getItem('atb_cart')) || {};}catch(e){cart={};}
    }

    function addToCart(id, qty=1){
      const p = PRODUCTS.find(x=>x.id===id);
      if(!p) return;
      cart[id] = cart[id] || { ...p, qty:0 };
      cart[id].qty += qty;
      renderCart();
      saveCart();
      flashAdded(p.name);
    }

    function removeFromCart(id){
      delete cart[id];
      renderCart();
      saveCart();
    }

    function changeQty(id, delta){
      if(!cart[id]) return;
      cart[id].qty += delta;
      if(cart[id].qty <= 0) removeFromCart(id);
      renderCart();
      saveCart();
    }

    function clearCart(){
      if(confirm('Ви впевнені, що хочете очистити кошик?')){
        cart = {};
        renderCart();
        saveCart();
      }
    }

    function renderCart(){
      const list = qi('cartList');
      list.innerHTML = '';
      const items = Object.values(cart);
      qi('cartCount').textContent = `(${items.length})`;
      if(items.length===0){
        qi('cartEmpty').style.display='block';
        qi('cartTotalWrap').style.display='none';
      } else {
        qi('cartEmpty').style.display='none';
        qi('cartTotalWrap').style.display='flex';
      }
      let total = 0;
      items.forEach(it => {
        total += it.price * it.qty;
        const el = document.createElement('div'); el.className='cart-item';
        el.innerHTML = `
          <div class="ci-img">${it.emoji}</div>
          <div class="ci-title">
            <div style="font-weight:700">${it.name}</div>
            <div style="font-size:13px;color:var(--muted)">${formatPrice(it.price)} · ${it.qty} шт.</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div class="qty">
              <button class="btn-ghost" onclick="changeQty('${it.id}',-1)">−</button>
              <div style="min-width:26px;text-align:center">${it.qty}</div>
              <button class="btn-ghost" onclick="changeQty('${it.id}',1)">+</button>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <div style="font-weight:800">${formatPrice(it.price * it.qty)}</div>
              <button class="btn-ghost" onclick="removeFromCart('${it.id}')">Видалити</button>
            </div>
          </div>
        `;
        list.appendChild(el);
      });
      qi('cartTotal').textContent = formatPrice(total);
    }

    // Small UI helpers
    function flashAdded(name){
      const old = document.querySelector('._flash'); if(old) old.remove();
      const n = document.createElement('div'); n.className='_flash';
      n.textContent = name + ' додано в кошик';
      Object.assign(n.style,{position:'fixed',right:'18px',bottom:'18px',background:'#111827',color:'white',padding:'10px 14px',borderRadius:'10px',boxShadow:'0 6px 18px rgba(2,6,23,0.4)',zIndex:9999});
      document.body.appendChild(n);
      setTimeout(()=>n.remove(),1500);
    }

    // Search
    qi('searchInput').addEventListener('input', e=>renderProducts(e.target.value));
    qi('clearBtn').addEventListener('click', clearCart);
    qi('checkoutBtn').addEventListener('click', ()=>{
      if(Object.keys(cart).length===0){alert('Кошик порожній');return}
      alert('Дякуємо! Замовлення оформлено (демо).');
      cart = {}; saveCart(); renderCart();
    });

    // Init
    loadCart(); renderProducts(); renderCart();
  </script>
</body>
</html>
